version: "3.8"

services:
  postgres:
    container_name: clickseekers-db
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: clickseekers
      POSTGRES_PASSWORD: "1234"

volumes:
  postgres_data:
